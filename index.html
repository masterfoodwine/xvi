<title>Calendario Food & Wine Communication</title>

<style>
/* Caratteri ospitati sul sito stesso (cartella fonts/): nessuna richiesta a Google, nessun dato degli studenti a terzi */
@font-face { font-family: "Manrope"; font-weight: 400; font-display: swap; src: url("fonts/manrope-latin-400-normal.woff2") format("woff2"); }
@font-face { font-family: "Manrope"; font-weight: 500; font-display: swap; src: url("fonts/manrope-latin-500-normal.woff2") format("woff2"); }
@font-face { font-family: "Manrope"; font-weight: 600; font-display: swap; src: url("fonts/manrope-latin-600-normal.woff2") format("woff2"); }
@font-face { font-family: "Manrope"; font-weight: 700; font-display: swap; src: url("fonts/manrope-latin-700-normal.woff2") format("woff2"); }
@font-face { font-family: "Manrope"; font-weight: 800; font-display: swap; src: url("fonts/manrope-latin-800-normal.woff2") format("woff2"); }
/* ============================================================================
   GUIDA RAPIDA ALLA GRAFICA
   Idea: un'etichetta di vino. Fascia bordeaux in alto con il prossimo incontro,
   barra fissa con le tre sezioni (Calendario, Docenti, Avvisi), poi l'agenda.
   - Colori: tutti in :root qui sotto (tema chiaro) e nei due blocchi "tema scuro".
     Il resto della pagina usa solo questi nomi: per cambiare un colore basta qui.
   - Carattere: Manrope ovunque (è il font della M dell'icona). --f-titoli per
     titoli e numeri (in grassetto 800), --f-testo per tutto il resto.
     I file dei caratteri sono in assets/fonts (nessuna richiesta a Google).
   ========================================================================== */
:root {
  --carta: #F6F3F2;          /* sfondo pagina */
  --scheda: #FFFFFF;         /* sfondo delle schede */
  --inchiostro: #1F1418;     /* testo principale */
  --tenue: #6D6266;          /* testo secondario */
  --filo: #E7E0DF;           /* bordi e linee */
  --vino: #7A1A36;           /* colore del master */
  --vino-marchio: #7A1A36;
  --testata: #FFFFFF;        /* sfondo della testata con il titolo */   /* colore dell'icona: resta uguale anche in tema scuro */
  --vino-tenue: #F4E6EA;
  --fascia: #4A0F22;         /* fascia in alto */
  --fascia-2: #2E0915;
  --fascia-testo: #FBF5F3;
  --fascia-tenue: #D6B9C1;
  --fascia-filo: rgba(255, 240, 230, .16);
  --oro: #CDA866;            /* dettagli champagne */
  --oro-scuro: #8C6A2C;
  --allerta: #B42318; --allerta-bg: #FDECEA;
  --t-lezione: #44506A;  --t-lezione-bg: #E8ECF3;
  --t-ospite: #7A1A36;   --t-ospite-bg: #F4E6EA;
  --t-pw: #4E5B22;       --t-pw-bg: #EAEDDB;
  --t-evento: #835A12;   --t-evento-bg: #F6EDD9;
  --t-lab: #22605B;      --t-lab-bg: #DEEFEC;
  --ombra: 0 1px 2px rgba(31, 20, 24, .05), 0 12px 32px rgba(31, 20, 24, .08);
  --velo: rgba(24, 10, 16, .45);
  --f-titoli: "Manrope", "Avenir Next", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-testo: "Manrope", "Avenir Next", "Segoe UI", system-ui, -apple-system, sans-serif;
  --r: 14px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --carta: #141012; --scheda: #1D181B; --inchiostro: #F1EAEC; --tenue: #A99EA3; --filo: #322A2E;
    --vino: #EE9AB2; --vino-tenue: #3A1A25;
    --fascia: #2B0A15; --fascia-2: #19060C; --fascia-testo: #FBF5F3; --fascia-tenue: #CBAAB4;
    --fascia-filo: rgba(255, 240, 230, .13); --oro: #DDBB7A; --oro-scuro: #DDBB7A; --testata: #FBF5F3;
    --allerta: #FF9C8F; --allerta-bg: #3B1714;
    --t-lezione: #B2C0DE; --t-lezione-bg: #232A39;
    --t-ospite: #EE9AB2;  --t-ospite-bg: #3A1A25;
    --t-pw: #C2D38C;      --t-pw-bg: #29301A;
    --t-evento: #E6C27A;  --t-evento-bg: #382C15;
    --t-lab: #92D5CE;     --t-lab-bg: #18302E;
    --ombra: 0 1px 2px rgba(0,0,0,.4), 0 12px 32px rgba(0,0,0,.4); --velo: rgba(0,0,0,.62);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --carta: #141012; --scheda: #1D181B; --inchiostro: #F1EAEC; --tenue: #A99EA3; --filo: #322A2E;
  --vino: #EE9AB2; --vino-tenue: #3A1A25;
  --fascia: #2B0A15; --fascia-2: #19060C; --fascia-testo: #FBF5F3; --fascia-tenue: #CBAAB4;
  --fascia-filo: rgba(255, 240, 230, .13); --oro: #DDBB7A; --oro-scuro: #DDBB7A; --testata: #FBF5F3;
  --allerta: #FF9C8F; --allerta-bg: #3B1714;
  --t-lezione: #B2C0DE; --t-lezione-bg: #232A39;
  --t-ospite: #EE9AB2;  --t-ospite-bg: #3A1A25;
  --t-pw: #C2D38C;      --t-pw-bg: #29301A;
  --t-evento: #E6C27A;  --t-evento-bg: #382C15;
  --t-lab: #92D5CE;     --t-lab-bg: #18302E;
  --ombra: 0 1px 2px rgba(0,0,0,.4), 0 12px 32px rgba(0,0,0,.4); --velo: rgba(0,0,0,.62);
  color-scheme: dark;
}

* { box-sizing: border-box; }
body { background: var(--carta); color: var(--inchiostro); font: 400 15px/1.6 var(--f-testo); -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
.wrap {
  max-width: 1100px; margin: 0 auto;
  padding-left: max(18px, env(safe-area-inset-left, 0px));
  padding-right: max(18px, env(safe-area-inset-right, 0px));
}
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--oro); outline-offset: 2px; border-radius: 6px; }
a { color: var(--vino); text-underline-offset: 3px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.ico { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.eyebrow { font: 700 11px/1.3 var(--f-testo); letter-spacing: .18em; text-transform: uppercase; }

/* ============================ FASCIA IN ALTO ============================ */
.hero {
  background:
    radial-gradient(90% 120% at 100% 0%, color-mix(in srgb, var(--oro) 13%, transparent), transparent 60%),
    linear-gradient(165deg, var(--fascia), var(--fascia-2));
  color: var(--fascia-testo);
}
.hero .wrap { padding-block: 18px 26px; display: grid; gap: 22px; }
.toprow { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
.brandlogo { height: 34px; width: auto; display: block; }
/* marchio: la stessa M dell'icona dell'app (Manrope 800, bordeaux su bianco, edizione sotto) */
.mark { flex: none; width: 46px; height: 46px; border-radius: 11px; background: #fff; color: var(--vino-marchio); display: grid; place-content: center; justify-items: center; gap: 0; box-shadow: 0 0 0 1px color-mix(in srgb, var(--oro) 35%, transparent); }
.mark b { font: 800 25px/.8 var(--f-testo); letter-spacing: -.04em; }
.mark i { width: 15px; height: 1.5px; background: currentColor; margin: 4px 0 3px; }
.mark span { font: 700 6.5px/1 var(--f-testo); letter-spacing: .34em; margin-right: -.34em; }
.kicker { color: var(--fascia-tenue); display: flex; flex-wrap: wrap; gap: 2px 10px; }
.kicker b { color: var(--oro); font-weight: 700; }
.bell {
  position: relative; flex: none; width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center;
  border: 1px solid var(--fascia-filo); background: transparent; color: var(--fascia-testo);
}
.bell:hover { border-color: var(--oro); }
.bell .ico { width: 20px; height: 20px; }
.badge { position: absolute; top: -3px; right: -3px; min-width: 19px; height: 19px; padding: 0 5px; border-radius: 999px; background: var(--oro); color: var(--fascia-2); font: 800 11px/19px var(--f-testo); text-align: center; }

/* testata bianca: bordeaux su bianco come l'icona; schema dei titoli IULM (etichetta + titolo grande) */
.label { background: var(--testata); color: var(--vino-marchio); border-radius: 22px; padding: clamp(22px, 4vw, 44px); display: grid; gap: 0; }
.label .ey { font: 700 11.5px/1.4 var(--f-testo); letter-spacing: .2em; text-transform: uppercase; color: #8C6A2C; margin-bottom: 16px; }
.title { margin: 0; font: 800 clamp(34px, 9.2vw, 104px)/.96 var(--f-titoli); letter-spacing: -.045em; }
.title > span { display: block; white-space: nowrap; }
.title .amp { font-weight: 500; color: #B08A45; }
.label .meta { margin-top: 22px; padding-top: 16px; border-top: 1px solid #EADDE1; display: flex; flex-wrap: wrap; gap: 6px 0; column-gap: 18px; font: 600 13.5px/1.4 var(--f-testo); color: #6D6266; }
.label .meta span + span { padding-left: 18px; border-left: 1px solid #DCCDD2; }
.label .meta b { color: var(--vino-marchio); }
@media (max-width: 600px) { .label .meta .u { flex-basis: 100%; border-left: 0; padding-left: 0; } .label .ey { font-size: 10.5px; letter-spacing: .14em; } }
.hero-grid { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 16px 22px; align-items: start; }
.alert {
  display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 10px; align-items: center;
  border: 1px solid color-mix(in srgb, var(--oro) 55%, transparent); background: color-mix(in srgb, var(--oro) 12%, transparent);
  border-radius: var(--r); padding: 12px 12px 12px 14px;
}
.alert .ico { color: var(--oro); margin-top: 2px; }
.alert b { display: block; font-weight: 700; font-size: 14.5px; }
.alert p { margin: 2px 0 0; font-size: 13.5px; color: var(--fascia-tenue); }
.alert .acts { display: flex; gap: 6px; align-items: center; }
.alert button { border: 0; background: none; color: var(--fascia-testo); font-size: 13px; font-weight: 700; padding: 6px 8px; border-radius: 8px; }
.alert button.x { font-size: 18px; line-height: 1; color: var(--fascia-tenue); }

.next {
  border: 1px solid var(--fascia-filo); border-radius: 20px; padding: 20px 22px 18px;
  background: color-mix(in srgb, var(--fascia-2) 60%, transparent); display: grid; gap: 10px; min-width: 0;
  box-shadow: inset 0 0 0 4px color-mix(in srgb, var(--fascia-2) 40%, transparent);
}
.next-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.next .lbl { color: var(--oro); display: inline-flex; align-items: center; gap: 8px; }
.next .lbl::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--oro); }
.next.live .lbl::before { animation: pulse 1.6s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .2; } }
.count { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.count b { font: 800 46px/.95 var(--f-titoli); letter-spacing: -.035em; font-variant-numeric: lining-nums; }
.count span { font: 500 18px/1 var(--f-testo); color: var(--fascia-tenue); }
.next .when { font-size: 13.5px; color: var(--fascia-tenue); font-variant-numeric: tabular-nums; }
.next .what { font: 600 19px/1.3 var(--f-testo); text-wrap: balance; }
.hero .chip { background: transparent; border-color: var(--fascia-filo); color: var(--fascia-testo); }
.hero .chip .ini { background: color-mix(in srgb, var(--oro) 22%, transparent); color: var(--oro); }
.hero .chip:hover, .hero .more:hover { border-color: var(--oro); }
.hero .more { color: var(--fascia-testo); border-color: var(--fascia-filo); }
.hero .extra, .hero .place { color: var(--fascia-tenue); }
.hero .extra b, .hero .place b { color: var(--fascia-testo); }
.next-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; padding-top: 14px; border-top: 1px solid var(--fascia-filo); }
.hbtn {
  display: inline-flex; align-items: center; gap: 7px; border-radius: 999px; padding: 9px 15px; font-size: 13.5px; font-weight: 700; text-decoration: none;
  border: 1px solid var(--fascia-filo); background: transparent; color: var(--fascia-testo);
}
.hbtn:hover { border-color: var(--oro); }
.hbtn.gold { background: var(--oro); border-color: var(--oro); color: var(--fascia-2); }
.hbtn .ico { width: 16px; height: 16px; }

/* ============================ PERCORSO (A TENDINA) ============================ */
.path { border: 1px solid var(--fascia-filo); border-radius: 20px; background: color-mix(in srgb, var(--fascia-2) 35%, transparent); overflow: hidden; }
.path-btn { width: 100%; border: 0; background: none; color: var(--fascia-testo); text-align: left; padding: 18px 20px; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 14px; align-items: center; }
.path-btn .eyebrow { color: var(--oro); grid-column: 1 / -1; }
.path-btn .ora { font: 800 24px/1.1 var(--f-titoli); letter-spacing: -.025em; }
.path-btn .ora em { font-style: normal; font-weight: 500; letter-spacing: 0; color: var(--fascia-tenue); font-size: .8em; }
.path-btn .apri { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 700; color: var(--fascia-tenue); white-space: nowrap; }
.path-btn .apri .ico { width: 16px; height: 16px; transition: transform .2s; }
.path-btn[aria-expanded="true"] .apri .ico { transform: rotate(180deg); }
.prog { grid-column: 1 / -1; display: flex; gap: 3px; margin-top: 8px; }
.prog i { flex: 1; height: 4px; border-radius: 2px; background: color-mix(in srgb, var(--fascia-testo) 16%, transparent); }
.prog i.fatto { background: color-mix(in srgb, var(--oro) 55%, transparent); }
.prog i.ora { background: var(--oro); }
.path-list { list-style: none; margin: 0; padding: 4px 8px 10px; border-top: 1px solid var(--fascia-filo); display: grid; max-height: 420px; overflow-y: auto; }
.mrow { width: 100%; border: 0; background: none; color: var(--fascia-testo); text-align: left; display: grid; grid-template-columns: 92px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 11px 12px; border-radius: 12px; }
.mrow:hover, .mrow[aria-current="true"] { background: color-mix(in srgb, var(--oro) 14%, transparent); }
.mrow .mn { font: 800 16px/1.1 var(--f-titoli); letter-spacing: -.02em; }
.mrow .mt { font-size: 13.5px; font-weight: 600; line-height: 1.3; min-width: 0; }
.mrow .md { display: block; font-size: 12px; font-weight: 500; color: var(--fascia-tenue); margin-top: 2px; font-variant-numeric: tabular-nums; }
.mrow .st { font: 800 9.5px/1 var(--f-testo); letter-spacing: .1em; text-transform: uppercase; padding: 5px 7px; border-radius: 999px; white-space: nowrap; border: 1px solid var(--fascia-filo); color: var(--fascia-tenue); }
.mrow .st.ora { background: var(--oro); border-color: var(--oro); color: var(--fascia-2); }
.mrow .st.ok { color: var(--fascia-testo); }
.mrow.passato { opacity: .55; }

/* ============================ BARRA FISSA ============================ */
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: color-mix(in srgb, var(--carta) 90%, transparent); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-bottom: 1px solid var(--filo); }
.bar .wrap { padding-block: 10px; display: grid; gap: 10px; }
.bar-row { display: flex; align-items: center; gap: 10px; }
.tabs { display: flex; flex: 1 1 auto; max-width: 400px; min-width: 0; background: var(--scheda); border: 1px solid var(--filo); border-radius: 999px; padding: 3px; }
.tab { flex: 1 1 0; min-width: 0; border: 0; background: none; padding: 8px 10px; border-radius: 999px; font-weight: 700; font-size: 13.5px; color: var(--tenue); white-space: nowrap; display: inline-flex; justify-content: center; align-items: center; gap: 6px; }
.tab[aria-selected="true"] { background: var(--inchiostro); color: var(--carta); }
.tab .dot { min-width: 18px; height: 18px; padding: 0 5px; border-radius: 999px; background: var(--vino); color: var(--scheda); font: 800 10.5px/18px var(--f-testo); }
.tab[aria-selected="true"] .dot { background: var(--oro); color: var(--fascia-2); }
.ibtn { flex: none; margin-left: auto; width: 42px; height: 42px; border-radius: 50%; border: 1px solid var(--filo); background: var(--scheda); display: grid; place-items: center; color: var(--inchiostro); position: relative; }
.ibtn + .ibtn { margin-left: 0; }
.ibtn[aria-pressed="true"], .ibtn[aria-expanded="true"] { border-color: var(--inchiostro); }
.ibtn .pip { position: absolute; top: 7px; right: 7px; width: 8px; height: 8px; border-radius: 50%; background: var(--vino); }
.search { position: relative; }
.search input { width: 100%; border: 1px solid var(--filo); background: var(--scheda); border-radius: 999px; padding: 10px 40px 10px 40px; font-size: 15px; }
.search input::placeholder { color: var(--tenue); }
.search > .ico { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--tenue); }
.search .clear { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); border: 0; background: none; color: var(--tenue); font-size: 20px; line-height: 1; padding: 4px 10px; border-radius: 999px; }
.filters { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; }
.filters::-webkit-scrollbar { display: none; }
.fchip { flex: none; border: 1px solid var(--filo); background: var(--scheda); border-radius: 999px; padding: 6px 12px; font-size: 13px; font-weight: 600; color: var(--tenue); display: inline-flex; align-items: center; gap: 7px; }
.fchip i { width: 8px; height: 8px; border-radius: 50%; background: var(--c); }
.fchip[aria-pressed="true"] { color: var(--c); border-color: var(--c); background: var(--cb); }

/* ============================ CALENDARIO ============================ */
main { padding-block: 6px 72px; min-height: 50vh; }
.modhead { display: grid; gap: 8px; padding-block: 30px 4px; }
.modhead .eyebrow { color: var(--vino); }
.modhead h2 { margin: 0; font: 800 clamp(26px, 3.8vw, 38px)/1.08 var(--f-titoli); letter-spacing: -.03em; text-wrap: balance; }
.modhead .meta { display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: center; color: var(--tenue); font-size: 14px; font-variant-numeric: tabular-nums; }
.modnav { display: inline-flex; gap: 6px; margin-left: auto; }
.modnav button { width: 38px; height: 38px; border: 1px solid var(--filo); background: var(--scheda); border-radius: 50%; display: grid; place-items: center; }
.modnav button:disabled { opacity: .35; cursor: default; }

.week { margin-top: 28px; }
.week-h { display: flex; align-items: center; gap: 12px; margin-bottom: 2px; color: var(--tenue); }
.week-h::after { content: ""; flex: 1; height: 1px; background: var(--filo); }

.day { display: grid; grid-template-columns: 84px minmax(0, 1fr); gap: 18px; padding-block: 16px; border-top: 1px solid var(--filo); scroll-margin-top: 150px; }
.week .day:first-of-type { border-top: 0; }
.date { display: grid; align-content: start; justify-items: start; gap: 2px; }
.date .dn { font: 800 44px/.88 var(--f-titoli); letter-spacing: -.04em; font-variant-numeric: lining-nums; }
.date .dw { font: 700 11px/1.3 var(--f-testo); letter-spacing: .14em; text-transform: uppercase; margin-top: 6px; }
.date .mo { font-size: 12.5px; color: var(--tenue); }
.date .oggi { margin-top: 6px; font: 800 10px/1 var(--f-testo); letter-spacing: .14em; text-transform: uppercase; color: var(--scheda); background: var(--vino); padding: 5px 8px; border-radius: 999px; }
.day.today .dn, .day.today .dw { color: var(--vino); }
.day.past .slot, .day.past .date { opacity: .55; }

.slots { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; min-width: 0; }
.slots.one { grid-template-columns: minmax(0, 1fr); }
.slot { background: var(--scheda); border: 1px solid var(--filo); border-radius: var(--r); padding: 15px 16px 12px; display: grid; gap: 10px; align-content: start; min-width: 0; }
.slot-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.time { font-size: 13.5px; font-weight: 600; color: var(--tenue); font-variant-numeric: tabular-nums; letter-spacing: .01em; }
.time b { color: var(--inchiostro); font-weight: 800; }
.tag { font: 800 10px/1 var(--f-testo); letter-spacing: .1em; text-transform: uppercase; padding: 5px 8px; border-radius: 999px; color: var(--c); background: var(--cb); white-space: nowrap; }
.slot h3 { margin: 0; font: 700 16.5px/1.35 var(--f-testo); text-wrap: pretty; overflow-wrap: anywhere; letter-spacing: -.005em; }
.det { margin: -4px 0 0; font: 500 14.5px/1.35 var(--f-testo); color: var(--tenue); }
.hero .det { color: var(--fascia-tenue); margin: -4px 0 0; }
.slot .mod-of { font-size: 12px; color: var(--tenue); }
.people { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  display: inline-flex; align-items: center; gap: 7px; border: 1px solid var(--filo); background: var(--carta);
  border-radius: 999px; padding: 3px 12px 3px 3px; font-size: 13.5px; font-weight: 600; line-height: 1.2; max-width: 100%; text-align: left;
}
.chip:hover { border-color: var(--vino); }
.chip .ini { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; flex: none; background: var(--vino-tenue); color: var(--vino); font: 800 11.5px/1 var(--f-titoli); letter-spacing: 0; }
.chip.org { padding-left: 12px; border-style: dashed; }
.more { border: 1px dashed var(--filo); background: transparent; border-radius: 999px; padding: 5px 12px; font-size: 13px; font-weight: 700; color: var(--vino); }
.extra, .place { font-size: 13.5px; color: var(--tenue); overflow-wrap: anywhere; margin: 0; display: flex; gap: 6px; align-items: flex-start; }
.extra b, .place b { font-weight: 700; color: var(--inchiostro); }
.place .ico { width: 15px; height: 15px; margin-top: 2px; color: var(--vino); }
.hero .place .ico { color: var(--oro); }
.slot-foot { display: flex; align-items: center; gap: 8px; padding-top: 10px; border-top: 1px solid var(--filo); }
.mat { font-size: 12.5px; font-weight: 700; text-decoration: none; color: var(--vino); background: var(--vino-tenue); border-radius: 999px; padding: 6px 12px; display: inline-flex; gap: 6px; align-items: center; }
.mat .ico { width: 15px; height: 15px; }
.gcal { margin-left: auto; font-size: 12.5px; font-weight: 700; text-decoration: none; color: var(--tenue); display: inline-flex; gap: 6px; align-items: center; padding: 6px 4px; }
.gcal .ico { width: 16px; height: 16px; }
.gcal:hover { color: var(--vino); }

.empty, .locked { margin-top: 26px; border: 1px dashed var(--filo); border-radius: 18px; padding: 28px; display: grid; gap: 8px; justify-items: start; }
.locked h2, .empty h2 { margin: 0; font: 800 26px/1.15 var(--f-titoli); letter-spacing: -.025em; }
.locked p, .empty p { margin: 0; color: var(--tenue); max-width: 60ch; }
.btn { display: inline-flex; align-items: center; gap: 7px; text-decoration: none; font-weight: 700; font-size: 14px; border: 1px solid var(--filo); border-radius: 999px; padding: 9px 15px; color: var(--inchiostro); background: var(--scheda); }
.btn:hover { border-color: var(--vino); }
.btn.primary { background: var(--vino); border-color: var(--vino); color: var(--scheda); }
.btn .ico { width: 16px; height: 16px; }

/* ============================ PERSONE ============================ */
.sec-head { padding-block: 30px 4px; display: grid; gap: 6px; }
.sec-head h2 { margin: 0; font: 800 clamp(26px, 3.8vw, 38px)/1.08 var(--f-titoli); letter-spacing: -.03em; }
.sec-head p { margin: 0; color: var(--tenue); max-width: 62ch; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; margin-top: 20px; }
.pcard { text-align: left; border: 1px solid var(--filo); background: var(--scheda); border-radius: var(--r); padding: 16px; display: grid; grid-template-columns: 54px minmax(0, 1fr); gap: 2px 14px; align-items: start; }
.pcard:hover { border-color: var(--vino); box-shadow: var(--ombra); }
.mono { width: 54px; height: 54px; border-radius: 50%; display: grid; place-items: center; background: var(--vino-tenue); color: var(--vino); font: 800 18px/1 var(--f-titoli); grid-row: span 3; overflow: hidden; border: 1px solid color-mix(in srgb, var(--vino) 18%, transparent); }
.mono img { width: 100%; height: 100%; object-fit: cover; }
.pcard .nm { font-weight: 800; font-size: 15.5px; }
.pcard .rl { font-size: 13.5px; color: var(--tenue); line-height: 1.4; }
.pcard .ct { font-size: 12px; font-weight: 700; color: var(--vino); font-variant-numeric: tabular-nums; margin-top: 4px; }
.sub-h { font: 800 24px/1.15 var(--f-titoli); letter-spacing: -.025em; margin: 40px 0 0; }
.orgs { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; margin-top: 14px; }
.ocard { border: 1px solid var(--filo); background: var(--scheda); border-radius: var(--r); padding: 16px 18px; display: grid; gap: 6px; align-content: start; }
.ocard h4 { margin: 0; font: 800 18px/1.2 var(--f-titoli); letter-spacing: -.02em; }
.ocard p { margin: 0; color: var(--tenue); font-size: 14px; }
.links { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; }
.ocard .links a { font-size: 13.5px; font-weight: 700; }

/* ============================ AVVISI ============================ */
.news { display: grid; gap: 12px; }
.nitem { position: relative; background: var(--carta); border: 1px solid var(--filo); border-radius: var(--r); padding: 16px 18px 16px 20px; display: grid; gap: 6px; }
.nitem.imp { border-color: color-mix(in srgb, var(--allerta) 40%, var(--filo)); }
.nitem.imp::before { content: ""; position: absolute; left: -1px; top: 14px; bottom: 14px; width: 3px; border-radius: 0 3px 3px 0; background: var(--allerta); }
.nmeta { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; font-size: 12.5px; color: var(--tenue); font-variant-numeric: tabular-nums; }
.pill { font: 800 10px/1 var(--f-testo); letter-spacing: .1em; text-transform: uppercase; padding: 5px 8px; border-radius: 999px; }
.pill.imp { color: var(--allerta); background: var(--allerta-bg); }
.pill.auto { color: var(--tenue); background: var(--carta); border: 1px solid var(--filo); }
.pill.new { color: var(--scheda); background: var(--vino); }
.nitem h3 { margin: 0; font: 700 16.5px/1.35 var(--f-testo); text-wrap: balance; }
.nsez { margin: 18px 0 8px; font: 700 11px/1.3 var(--f-testo); letter-spacing: .18em; text-transform: uppercase; color: var(--tenue); }
.nsez:first-of-type { margin-top: 4px; }
.news.old .nitem { background: transparent; }
.news.old .nitem h3 { color: var(--tenue); }
.nitem p { margin: 0; color: var(--tenue); font-size: 14.5px; max-width: 65ch; }
.nitem .links { margin-top: 4px; }
.nitem .links button, .nitem .links a { font-size: 13.5px; font-weight: 700; border: 0; background: none; color: var(--vino); padding: 0; text-decoration: underline; text-underline-offset: 3px; }

footer { margin-block: 34px 28px; padding-top: 18px; border-top: 1px solid var(--filo); color: var(--tenue); font-size: 12.5px; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 6px 18px; }

/* ============================ PULSANTE "OGGI" ============================ */
.fab {
  position: fixed; z-index: 6; right: max(18px, calc(env(safe-area-inset-right, 0px) + 12px)); bottom: calc(18px + env(safe-area-inset-bottom, 0px));
  display: inline-flex; align-items: center; gap: 8px; border: 0; border-radius: 999px; padding: 12px 18px;
  background: var(--inchiostro); color: var(--carta); font-weight: 800; font-size: 14px; box-shadow: var(--ombra);
  transition: opacity .2s, transform .2s;
}
.fab .ico { width: 17px; height: 17px; }
.fab.off { opacity: 0; transform: translateY(12px); pointer-events: none; }

/* ============================ PANNELLO ============================ */
.velo { position: fixed; inset: 0; background: var(--velo); opacity: 0; transition: opacity .2s; z-index: 20; }
.velo.on { opacity: 1; }
.panel {
  position: fixed; z-index: 21; background: var(--scheda); color: var(--inchiostro); box-shadow: var(--ombra);
  top: 0; right: 0; bottom: 0; width: min(480px, 100%);
  padding: calc(22px + env(safe-area-inset-top, 0px)) calc(26px + env(safe-area-inset-right, 0px)) calc(30px + env(safe-area-inset-bottom, 0px)) 26px;
  overflow-y: auto; overscroll-behavior: contain; transform: translateX(102%); transition: transform .28s cubic-bezier(.2,.8,.2,1); display: grid; align-content: start; gap: 16px; border-left: 1px solid var(--filo);
}
.panel.on { transform: none; }
.panel .close { justify-self: end; border: 1px solid var(--filo); background: var(--carta); border-radius: 999px; padding: 7px 14px; font-size: 13px; font-weight: 700; }
.grab { display: none; }
.p-head { display: grid; grid-template-columns: 76px minmax(0, 1fr); gap: 16px; align-items: center; }
.segnala { margin: 4px 0 0; padding-top: 14px; border-top: 1px solid var(--filo); font-size: 13px; color: var(--tenue); }
.segnala a { color: var(--vino); font-weight: 700; text-underline-offset: 3px; }
.p-head .mono { width: 76px; height: 76px; font-size: 30px; grid-row: auto; }
.p-head h2 { margin: 0; font: 800 26px/1.1 var(--f-titoli); letter-spacing: -.03em; }
.p-head .rl { color: var(--tenue); font-size: 14px; margin-top: 6px; }
.panel .eyebrow { color: var(--tenue); margin-top: 8px; }
.panel p { margin: 0; }
.bio { font-size: 15.5px; line-height: 1.7; }
.note { font-size: 13.5px; color: var(--t-evento); background: var(--t-evento-bg); padding: 10px 12px; border-radius: 10px; }
.mini { display: grid; gap: 0; }
.mini div { display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 12px; font-size: 14px; padding-block: 10px; border-top: 1px solid var(--filo); }
.mini div:first-child { border-top: 0; }
.mini .d { font-size: 12.5px; font-weight: 700; color: var(--tenue); font-variant-numeric: tabular-nums; line-height: 1.5; }
.org-box { border: 1px solid var(--filo); background: var(--carta); border-radius: var(--r); padding: 14px 16px; display: grid; gap: 4px; }
.org-box b { font: 800 17px/1.2 var(--f-titoli); letter-spacing: -.02em; }
.org-box p { color: var(--tenue); font-size: 14px; }
.copyrow { display: flex; gap: 8px; align-items: stretch; }
.copyrow input { flex: 1; min-width: 0; border: 1px solid var(--filo); background: var(--carta); border-radius: 10px; padding: 9px 11px; font-size: 12.5px; }
.steps { margin: 0; padding-left: 20px; display: grid; gap: 6px; font-size: 14px; color: var(--tenue); }
.steps b { color: var(--inchiostro); }

/* ============================ TELEFONO ============================ */
@media (min-width: 761px) {
  .only-phone { display: none !important; }
}
@media (max-width: 760px) {
  .only-desk { display: none !important; }
  .hero .wrap { padding-block: 14px 20px; gap: 18px; }
  .hero-grid { grid-template-columns: minmax(0, 1fr); gap: 12px; }
  .mrow { grid-template-columns: 78px minmax(0, 1fr) auto; padding: 10px 8px; gap: 10px; }
  .next { padding: 18px 18px 16px; border-radius: 18px; }
  .count b { font-size: 44px; }
  .slots { grid-template-columns: minmax(0, 1fr); }
  .day { grid-template-columns: 52px minmax(0, 1fr); gap: 12px; }
  .date .dn { font-size: 40px; }
  .date .dw { font-size: 10px; letter-spacing: .1em; }
  .date .mo { font-size: 11.5px; }
  .modhead { padding-block: 24px 0; }
  .panel { top: auto; left: 0; width: 100%; max-height: 90%; border-left: 0; border-top: 1px solid var(--filo); border-radius: 22px 22px 0 0; transform: translateY(102%);
    padding: 10px max(20px, env(safe-area-inset-right, 0px)) calc(28px + env(safe-area-inset-bottom, 0px)) max(20px, env(safe-area-inset-left, 0px)); }
  .grab { display: block; justify-self: center; width: 40px; height: 4px; border-radius: 4px; background: var(--filo); }
  .p-head { grid-template-columns: 64px minmax(0, 1fr); }
  .p-head .mono { width: 64px; height: 64px; font-size: 26px; }
  .p-head h2 { font-size: 28px; }
}
/* ============================ EVENTI ============================
   Card di un evento che si espande nel calendario (fogli Eventi e Programma di anagrafica.xlsx). */
.slot.ev-open { grid-column: 1 / -1; }
.exp-btn { display: flex; align-items: center; justify-content: space-between; gap: 10px; width: 100%; text-align: left; border: 1px solid #E8D3A6; background: #FBF4E4; color: #5A4515; border-radius: 12px; padding: 11px 14px; font: 800 13.5px/1.3 var(--f-testo); }
.exp-btn .ico { width: 16px; height: 16px; flex: none; transition: transform .2s; }
.exp-btn[aria-expanded="true"] .ico { transform: rotate(180deg); }
.exp { display: grid; gap: 14px; }
.ev-intro { margin: 0; font-size: 14.5px; line-height: 1.55; color: var(--tenue); max-width: 90ch; }
.slot.ev-open { border-left: 3px solid #B08A45 !important; }
.slot.ev-open .exp-btn { background: none; border: 0; border-top: 1px solid var(--filo); border-radius: 0; padding: 12px 0 2px; color: var(--vino); }
.slot.ev-open .exp { gap: 18px; }
.ev-cols { display: grid; grid-template-columns: minmax(0, 1fr); gap: 18px; }
.ev-l, .ev-r { display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; align-content: start; min-width: 0; }
.ev-facts { border-top: 1px solid var(--filo); border-bottom: 1px solid var(--filo); }
.ev-facts div { display: grid; grid-template-columns: 20px minmax(0, 1fr); gap: 10px; padding: 12px 0; font-size: 14px; line-height: 1.45; border-top: 1px solid var(--filo); color: var(--tenue); }
.ev-facts div:first-child { border-top: 0; }
.ev-facts b { display: block; color: var(--inchiostro); }
.ev-facts .ico { width: 18px; height: 18px; color: var(--vino); margin-top: 1px; }
.ev-note { font-size: 14px; line-height: 1.5; color: var(--tenue); }
.ev-note b { display: block; font: 800 10.5px/1.4 var(--f-testo); letter-spacing: .18em; text-transform: uppercase; color: #8C6A2C; margin-bottom: 3px; }
.exp .eyebrow { color: var(--tenue); }
.tl { display: grid; grid-template-columns: minmax(0, 1fr); border-left: 1px solid #E2CFA0; margin-left: 5px; }
.tl .r { position: relative; display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 12px; padding: 10px 0 10px 22px; }
.tl .r::before { content: ""; position: absolute; left: -5px; top: 16px; width: 9px; height: 9px; border-radius: 50%; background: #B08A45; box-shadow: 0 0 0 3px var(--scheda); }
.tl .t { font: 800 12.5px/1.5 var(--f-testo); color: var(--vino); font-variant-numeric: tabular-nums; }
.tl .h { font: 800 15.5px/1.3 var(--f-titoli); letter-spacing: -.01em; color: var(--inchiostro); }
.tl .k { display: block; font: 800 10px/1 var(--f-testo); letter-spacing: .16em; text-transform: uppercase; color: #8C6A2C; margin-bottom: 6px; }
.tl .d { margin: 4px 0 0; font-size: 13.5px; line-height: 1.5; color: var(--tenue); }
.tl .sp { margin: 6px 0 0; padding: 0; list-style: none; font-size: 13.5px; line-height: 1.5; color: var(--tenue); }
.tl .sp b { color: var(--inchiostro); font-weight: 700; }
.mz { margin: 0; font-size: 13.5px; line-height: 1.75; color: var(--tenue); }
.mz .sep { color: #B08A45; font-weight: 700; padding: 0 3px; }
@media (min-width: 761px) { .ev-cols { grid-template-columns: 320px minmax(0, 1fr); column-gap: 40px; } }
.ev-acts { display: flex; flex-wrap: wrap; gap: 8px; }
.slot.ev-hl { box-shadow: 0 0 0 3px var(--oro); }
.alert button[data-apri-ev] { background: var(--oro); color: var(--fascia-2); padding: 8px 14px; border-radius: 999px; }
.alert { align-items: start; }
@media (max-width: 600px) {
  .tl .r { grid-template-columns: minmax(0, 1fr); gap: 2px; }
  .tl .r::before { top: 14px; }
  .alert { grid-template-columns: auto minmax(0, 1fr); }
  .alert .acts { grid-column: 1 / -1; justify-content: space-between; }
}

/* sezione Eventi sotto la testata: filetto oro, si popola dal foglio Eventi */
.evid { border-left: 3px solid var(--oro); padding: 4px 0 4px 22px; color: var(--fascia-testo); display: grid; gap: 14px; }
.evid .top { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px 28px; align-items: center; }
.evid .ey { font: 700 11px/1.3 var(--f-testo); letter-spacing: .2em; text-transform: uppercase; color: var(--oro); }
.evid h3 { margin: 5px 0 0; font: 800 clamp(24px, 3.2vw, 34px)/1.05 var(--f-titoli); letter-spacing: -.035em; }
.evid .info { margin: 6px 0 0; font-size: 14px; line-height: 1.5; color: #E3CFD5; }
.evid .rule { margin: 6px 0 0; font-size: 13.5px; line-height: 1.5; color: var(--fascia-tenue); max-width: 70ch; }
.evid .rule b { color: var(--fascia-testo); font-weight: 700; }
.evid .go { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--oro); background: transparent; color: var(--fascia-testo); border-radius: 999px; padding: 11px 18px; font: 800 13.5px/1 var(--f-testo); white-space: nowrap; }
.evid .go:hover { background: color-mix(in srgb, var(--oro) 16%, transparent); }
.evid .go .ico { width: 16px; height: 16px; }
.evid-more { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--fascia-filo); }
.evid-more button { width: 100%; display: grid; grid-template-columns: 110px minmax(0, 1fr) auto; gap: 12px; align-items: center; text-align: left; border: 0; border-bottom: 1px solid var(--fascia-filo); background: none; color: var(--fascia-testo); padding: 11px 0; font: 700 14.5px/1.3 var(--f-testo); }
.evid-more .d { font: 700 11px/1.3 var(--f-testo); letter-spacing: .14em; text-transform: uppercase; color: var(--oro); }
.evid-more .ico { width: 16px; height: 16px; color: var(--oro); }
@media (max-width: 600px) { .evid { padding-left: 16px; } .evid .top { grid-template-columns: minmax(0, 1fr); } .evid .go { justify-self: start; } .evid-more button { grid-template-columns: 84px minmax(0, 1fr) auto; } }

/* ============================ ARCHIVIO ============================
   Le giornate già passate del modulo sono raccolte sotto un pulsante. */
.arch { margin-top: 22px; }
.arch-btn { display: flex; align-items: center; gap: 12px; width: 100%; border: 1px solid var(--fondo-filo, var(--filo)); background: color-mix(in srgb, var(--fondo-testo, #fff) 7%, transparent); color: var(--fondo-testo, var(--inchiostro)); border-radius: 14px; padding: 13px 16px; text-align: left; font: 700 14px/1.3 var(--f-testo); }
.arch-btn .ico { width: 18px; height: 18px; flex: none; color: var(--oro); }
.arch-btn .n { color: var(--fondo-tenue, var(--tenue)); font-weight: 600; }
.arch-btn .chev { margin-left: auto; transition: transform .2s; }
.arch-btn[aria-expanded="true"] .chev { transform: rotate(180deg); }
.arch-body .week:first-child { margin-top: 14px; }
.arch-end { display: flex; align-items: center; gap: 12px; margin-top: 26px; color: var(--fondo-tenue, var(--tenue)); font: 700 11px/1 var(--f-testo); letter-spacing: .16em; text-transform: uppercase; }
.arch-end::before, .arch-end::after { content: ""; flex: 1; height: 1px; background: var(--fondo-filo, var(--filo)); }

/* ============================ FONDO BORDEAUX ============================
   Sotto la fascia il bordeaux continua: calendario e docenti su fondo scuro,
   lezioni e schede come card bianche (stesso abbinamento dell'icona). */
:root { --fondo: #3A0B1A; --fondo-testo: #FBF5F3; --fondo-tenue: #D6B9C1; --fondo-filo: rgba(255, 240, 230, .14); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --fondo: #1E0710; } :root:not([data-theme="light"]) :is(.slot, .pcard, .ocard) { border-color: var(--filo); } }
:root[data-theme="dark"] { --fondo: #1E0710; }
:root[data-theme="dark"] :is(.slot, .pcard, .ocard) { border-color: var(--filo); }
body { background: var(--fondo); }
.hero { background:
    radial-gradient(90% 120% at 100% 0%, color-mix(in srgb, var(--oro) 13%, transparent), transparent 60%),
    linear-gradient(180deg, var(--fascia), var(--fondo)); }
.bar { background: color-mix(in srgb, var(--fondo) 92%, transparent); border-bottom-color: var(--fondo-filo); }
.ibtn { border-color: transparent; }
.modhead .eyebrow { color: var(--oro); }
.modhead h2, .sec-head h2, .sub-h { color: var(--fondo-testo); }
.modhead .meta, .sec-head p, footer { color: var(--fondo-tenue); }
footer { border-top-color: var(--fondo-filo); }
.week-h { color: var(--fondo-tenue); }
.week-h::after { background: var(--fondo-filo); }
.day { border-top-color: var(--fondo-filo); }
.date .dn, .date .dw { color: var(--fondo-testo); }
.date .mo { color: var(--fondo-tenue); }
.day.today .dn, .day.today .dw { color: var(--oro); }
.date .oggi { background: var(--oro); color: var(--fascia-2); }

/* ============================ AVVISI ============================ */
/* Scritti dallo staff nel foglio Avvisi di anagrafica.xlsx. Si aprono dalla
   campanella; quelli "importanti" compaiono anche in evidenza in cima alla pagina.
   Ogni avviso appare dalla sua data e sparisce dopo "Visibile fino al". */
/* Avvisi automatici:
   - «Calendario aggiornato»: quando cambiano le lezioni visibili (rilevato a ogni pubblicazione), per 7 giorni;
     gli aggiornamenti precedenti (ultimi 30 giorni) restano nello storico come già letti.
   - «Novità»: presentazione delle nuove funzioni dell'app, scritte qui con la loro scadenza. */
const NOVITA = [
  { id: "novita-guida-campus", data: "2026-10-22", fino: "2026-11-12", titolo: "Novità: la guida al campus",
    testo: "Mappa ufficiale e indicazioni per raggiungere ogni edificio. La trovi sotto il percorso dei moduli; nelle lezioni basta toccare il nome dell’aula.",
    link: { etichetta: "Apri la guida", url: "#campus" } }
];
// articolo davanti al nome del modulo: «il Modulo 2», «l'Apertura», «il Laboratorio»
const conArticolo = m => { const n = nomeModulo(m); return n === "Apertura" ? "l’Apertura" : "il " + n; };
const conclus = m => nomeModulo(m) === "Apertura" ? "conclusa" : "concluso";
const piuGiorni = (iso, n) => { const d = parse(iso); d.setDate(d.getDate() + n); return isoDi(d); };
function avvisiAutomatici() {
  const ora = adesso(), oggi = isoDi(ora), out = [];
  // dagli eventi registrati a ogni pubblicazione: calendario cambiato, nuovo modulo pubblicato
  let primoCal = true;
  (D.aggiornamenti || []).forEach(u => {
    const giorni = (ora - new Date(u.quando)) / 864e5;
    if (!(giorni >= 0 && giorni <= 30)) return;
    const quando = `${fmt(u.quando.slice(0, 10), { weekday: "long", day: "numeric", month: "long" })} alle ${u.quando.slice(11, 16)}`;
    const base = { data: u.quando.slice(0, 10), ora: u.quando.slice(11, 16) };
    if ((u.tipo || "calendario") === "calendario") {
      const recente = primoCal && giorni <= 7; primoCal = false;
      out.push({ ...base, id: "calendario-" + u.firma, tipo: "Calendario", titolo: "Calendario aggiornato",
        testo: `Il calendario è stato aggiornato ${quando}. Controlla orari e aule delle prossime lezioni.`, evidenza: recente, storico: !recente });
    } else if (u.tipo === "modulo") {
      const m = D.moduli.find(x => x.id === u.id && x.pubblicato); if (!m) return;
      const recente = giorni <= 7;
      out.push({ ...base, id: "pubblicato-" + m.id, tipo: "Moduli", titolo: `Pubblicato ${conArticolo(m)}`,
        testo: `${nomeModulo(m)} · ${m.titolo}${m.dal ? ` (${intervallo(m)})` : ""}. Trovi lezioni, docenti e aule.`,
        link: { etichetta: "Vai al modulo", url: "#" + m.id }, evidenza: recente, storico: !recente });
    }
  });
  // dalle date dei moduli: inizio (3 giorni prima) e fine (nei 5 giorni successivi)
  const ordinati = D.moduli.filter(m => m.dal).sort((x, y) => x.dal.localeCompare(y.dal));
  ordinati.forEach((m, i) => {
    if (m.pubblicato && m.giorni && m.giorni.length && piuGiorni(m.dal, -3) <= oggi && oggi <= m.dal) {
      const l = m.giorni[0].lezioni[0] || {}, aula = (l.luogo || "").split(" (")[0];
      const quando = m.dal === oggi ? "Oggi" : m.dal === piuGiorni(oggi, 1) ? "Domani" : maiuscola(fmt(m.dal, { weekday: "long", day: "numeric", month: "long" }));
      out.push({ id: "inizio-" + m.id, data: piuGiorni(m.dal, -3), tipo: "Moduli", titolo: `${quando} inizia ${conArticolo(m)}`,
        testo: `${m.titolo}.${l.inizio ? ` Prima lezione alle ${l.inizio.replace(/^0/, "")}${aula ? ` in ${aula}` : ""}.` : ""}`,
        link: { etichetta: "Vai al modulo", url: "#" + m.id }, evidenza: m.dal > oggi });
    }
    if (m.pubblicato && m.al && m.al < oggi && oggi <= piuGiorni(m.al, 5)) {
      const dopo = ordinati.slice(i + 1).find(x => x.dal > m.al);
      out.push({ id: "fine-" + m.id, data: piuGiorni(m.al, 1), tipo: "Moduli", titolo: `Si è ${conclus(m)} ${conArticolo(m)}`,
        testo: `${m.titolo}. Le lezioni restano consultabili nell’archivio del modulo.${dopo ? ` Il prossimo è ${conArticolo(dopo)} · ${dopo.titolo}, dal ${fmt(dopo.dal, { day: "numeric", month: "long" })}.` : ""}`,
        link: dopo && dopo.pubblicato ? { etichetta: "Vai al prossimo modulo", url: "#" + dopo.id } : null });
    }
  });
  return out;
}
function avvisiAttivi() {
  const oggi = isoDi(adesso());
  const novita = NOVITA.map(a => ({ ...a, tipo: "Novità", evidenza: true }));
  return (D.avvisi || []).concat(novita, avvisiAutomatici())
    .filter(a => (!a.data || a.data <= oggi) && (!a.fino || a.fino >= oggi))
    .sort((a, b) => (!!b.importante - !!a.importante) || (b.data || "").localeCompare(a.data || "") || (b.ora || "").localeCompare(a.ora || ""));
}
const letti = () => { try { return new Set(JSON.parse(store.get("fw-letti") || "[]")); } catch (e) { return new Set(); } };
function segnaLetti(ids) { const s = letti(); ids.forEach(i => s.add(i)); store.set("fw-letti", JSON.stringify([...s].slice(-300))); }
const daLeggere = (a, s) => !a.storico && !s.has(a.id);

// link interni degli avvisi: evento, guida al campus, scheda di un edificio
function linkAvviso(a, bottone) {
  const u = a.link.url, e = esc(a.link.etichetta), id = esc(a.id);
  const ed = u.match(/^#come-arrivare-iulm-(\d)$/);

  const attr = u.startsWith("#evento-") ? `data-apri-ev="${esc(u.slice(8))}"` : u === "#campus" ? "data-campus" : ed ? `data-ed-apri="IULM ${ed[1]}"` : mod ? `data-avv-mod="${esc(mod.id)}"` : "";
  if (bottone) return attr ? `<button ${attr} data-letto="${id}">${e}</button>` : `<button data-leggi>Leggi</button>`;
  return attr ? `<a href="${esc(u)}" ${attr} data-letto="${id}">${e} →</a>` : `<a href="${esc(u)}" target="_blank" rel="noopener">${e} ↗</a>`;
}
// priorità del banner: avvisi importanti dello staff, calendario aggiornato, modulo pubblicato, inizio modulo, novità
const prioritaBanner = a => a.importante ? 0 : a.tipo === "Calendario" ? 1 : /^pubblicato-/.test(a.id) ? 2 : /^inizio-/.test(a.id) ? 3 : a.tipo === "Novità" ? 4 : 5;
const sessione = { get: k => { try { return sessionStorage.getItem(k); } catch (e) { return null; } }, set: (k, v) => { try { sessionStorage.setItem(k, v); } catch (e) {} } };
function renderAlert() {
  const s = letti();
  let a = avvisiAttivi().filter(x => (x.importante || x.evidenza) && daLeggere(x, s)).sort((x, y) => prioritaBanner(x) - prioritaBanner(y))[0];

  $("#alert-slot").innerHTML = a ? `<div class="alert${a.importante ? "" : " info"}" role="status">${ico(a.importante ? "alert" : a.tipo === "Novità" ? "pin" : a.tipo === "Moduli" ? "archive" : "today")}<div><b>${esc(a.titolo)}</b>${a.testo ? `<p>${esc(a.testo)}</p>` : ""}</div>
    <div class="acts">${azione}<button class="x" data-chiudi-avviso="${esc(a.id)}" aria-label="Nascondi avviso">×</button></div></div>` : "";
}
function apriAvvisi() {
  const lista = avvisiAttivi(), s = letti();

      <div class="nmeta">${nuovo ? `<span class="pill new">Nuovo</span>` : ""}${a.importante ? `<span class="pill imp">Importante</span>` : ""}${a.tipo && !norm(a.titolo).includes(norm(a.tipo)) ? `<span class="pill auto">${esc(a.tipo)}</span>` : ""}${a.data && a.tipo !== "Calendario" ? `<span>${esc(fmt(a.data, { day: "numeric", month: "long" }))}${a.ora ? ` · ${esc(a.ora)}` : ""}</span>` : ""}</div>

function prossima() {
  const now = adesso();
  for (const l of tutte) if (quando(l.data, l.fine) > now) return { l, live: quando(l.data, l.inizio) <= now };
  return null;
}

function renderNext() {
  const box = $("#next"), p = prossima();
  if (!p) {
    box.className = "next";
    box.innerHTML = `<span class="lbl eyebrow">Calendario</span><p class="what">Le prossime lezioni saranno pubblicate a breve.</p>`;
    return;
  }
  const { l, live } = p, now = adesso(), gg = giorniTra(now, parse(l.data));
  // la parola grande dice «quando»; il testo piccolo solo quanto manca (data e orari sono nella riga sotto)
  const durata = ms => { const m = Math.max(1, Math.round(ms / 60000)), h = Math.floor(m / 60), r = m % 60; return h ? `${h} h${r ? ` ${r} min` : ""}` : `${m} min`; };
  let n, u;
  if (live) { n = "Ora"; u = `ancora ${durata(quando(l.data, l.fine) - now)}`; }
  else if (gg === 0) { n = "Oggi"; u = `tra ${durata(quando(l.data, l.inizio) - now)}`; }
  else if (gg === 1) { n = "Domani"; u = ""; }
  else { n = gg; u = "giorni"; }
  box.className = "next" + (live ? " live" : "");
  box.innerHTML = `
    <div class="next-top"><span class="lbl eyebrow">${live ? "In corso" : "Prossimo incontro"}</span><span class="tag" style="${stileTipo(l.tipo)}">${esc(l.tipo)}</span></div>
    <div class="count"><b>${esc(n)}</b>${u ? `<span>${esc(u)}</span>` : ""}</div>
    <div class="when">${esc(riduci(fmt(l.data, { weekday: "long", day: "numeric", month: "long" })))} · ${esc(l.inizio)}–${esc(l.fine)}</div>
    <div class="what">${esc(l.titolo)}</div>
    ${l.dettaglio ? `<p class="det">${esc(l.dettaglio)}</p>` : ""}
    ${relatori(l, 3)}
    <div class="next-actions">
      <button class="hbtn gold" data-vai="${esc(l.mod.id)}|${esc(l.data)}">Vai al giorno</button>
      <a class="hbtn" href="${esc(linkGoogle(l))}" target="_blank" rel="noopener">${ico("cal")}Aggiungi al calendario</a>
    </div>`;
  verificaIcs();
}

function renderPath() {
  const conDate = D.moduli.filter(m => m.dal);
  if (!conDate.length) return;
  const now = adesso(), oggi = isoDi(now);
  const corrente = conDate.find(m => m.dal <= oggi && oggi <= m.al);
  const prossimo = conDate.find(m => m.dal > oggi);
  const gg = giorniTra(now, parse(conDate[0].dal));
  const fine = oggi > conDate[conDate.length - 1].al;
  const ora = corrente ? `${esc(nomeModulo(corrente))} <em>in corso</em>`
    : fine ? "Percorso concluso"
    : gg > 0 ? `Si parte <em>tra ${gg} ${gg === 1 ? "giorno" : "giorni"}</em>`
    : prossimo ? `${esc(nomeModulo(prossimo))} <em>dal ${esc(fmt(prossimo.dal, { day: "numeric", month: "short" }))}</em>` : "";
  const aperto = !$("#path-list").hidden;
  $("#path-btn").setAttribute("aria-expanded", aperto);
  $("#path-btn").innerHTML = `<span class="eyebrow">Il percorso · ${conDate.length} moduli</span>
    <span class="ora">${ora}</span><span class="apri">${aperto ? "Chiudi" : "Tutti i moduli"}${ico("down")}</span>
    <span class="prog" aria-hidden="true">${conDate.map(m => `<i class="${m.al < oggi ? "fatto" : m === corrente ? "ora" : ""}"></i>`).join("")}</span>`;

    const inCorso = m === corrente;

    return `<li><button class="mrow ${m.al < oggi ? "passato" : ""}" data-mod="${esc(m.id)}" aria-current="${m.id === stato.modulo && stato.tab === "cal"}">
      <span class="mn">${esc(breve(m))}</span>
      <span class="mt">${esc(m.titolo.replace(/^Laboratorio · /, ""))}<span class="md">${esc(intervallo(m))}</span></span>${st}</button></li>`;
  }).join("");
}

/* ============================ CALENDARIO ============================ */
function relatori(l, max = 4) {
  const ch = [];
  for (const pid of l.persone) {
    const p = D.persone[pid]; if (!p) continue;
    ch.push(`<button class="chip" data-p="${esc(pid)}"><span class="ini" aria-hidden="true">${esc(ini(p.nome))}</span><span>${esc(p.nome)}</span></button>`);
  }
  for (const oid of l.organizzazioni) {
    const o = D.organizzazioni[oid]; if (!o) continue;
    ch.push(`<button class="chip org" data-o="${esc(oid)}">${esc(o.nome)}</button>`);
  }
  let h = "";
  if (ch.length) {
    const visibili = ch.length > max + 1 ? ch.slice(0, max) : ch;
    const nascosti = ch.slice(visibili.length);
    h = `<div class="people">${visibili.join("")}${nascosti.length ? `<button class="more" data-altri="${esc(encodeURIComponent(nascosti.join("")))}">+${nascosti.length} ${nascosti.length === 1 ? "altro" : "altri"}</button>` : ""}</div>`;
  }
  if (l.altri.length) h += `<p class="extra"><span>${ch.length ? "Con anche: " : "Con: "}<b>${esc(l.altri.join(", "))}</b></span></p>`;
  if (l.staff) h += `<p class="extra"><span>${ch.length || l.altri.length ? "Insieme allo " : "Con lo "}<b>staff del master</b></span></p>`;
  if (l.luogo) {
    // "Aula 412 (Edificio IULM 4, 1° piano)" → Aula 412 in evidenza, edificio e piano accanto
    const m = l.luogo.match(/^(.*?)\s*\((.*)\)\s*$/);
    h += `<p class="place">${ico("pin")}<span><b>${esc(m ? m[1] : l.luogo)}</b>${m ? ` · ${esc(m[2])}` : ""}</span></p>`;
  }
  return h;
}

const maiuscola = s => s.charAt(0).toUpperCase() + s.slice(1);
function eventoHtml(ev) {

  const prog = ev.programma.map(r => `<div class="r"><span class="t">${esc(r.ora)}</span><div>

      ${r.descrizione ? `<p class="d">${esc(r.descrizione)}</p>` : ""}</div></div>`).join("");
  // a sinistra le informazioni pratiche, a destra il programma (su telefono una sotto l'altra)

  </article>`;

const lunedi = iso => { const d = parse(iso); d.setDate(d.getDate() - ((d.getDay() + 6) % 7)); return isoDi(d); };

function giorniHtml(lezioni, mostraModulo, conArchivio) {
  const perGiorno = new Map();
  for (const l of lezioni) { if (!perGiorno.has(l.data)) perGiorno.set(l.data, []); perGiorno.get(l.data).push(l); }
  const giorni = [...perGiorno].sort((a, b) => a[0].localeCompare(b[0]));
  const oggi = isoDi(adesso());
  const settimane = lista => {
    const perSett = new Map();
    for (const [d, ls] of lista) { const k = lunedi(d); if (!perSett.has(k)) perSett.set(k, []); perSett.get(k).push([d, ls]); }
    let h = "";
    for (const [, gg] of perSett) {
      const da = gg[0][0], a = gg[gg.length - 1][0];
      const stessoMese = parse(da).getMonth() === parse(a).getMonth();
      const lab = da === a ? fmt(da, { day: "numeric", month: "long" }) : `${fmt(da, stessoMese ? { day: "numeric" } : { day: "numeric", month: "long" })} – ${fmt(a, { day: "numeric", month: "long" })}`;
      h += `<section class="week"><div class="week-h eyebrow">Settimana ${esc(lab)}</div>`;
      for (const [d, ls] of gg) {
        const cls = d === oggi ? "today" : d < oggi ? "past" : "";
        ls.sort((x, y) => (x.inizio || "").localeCompare(y.inizio || ""));
        h += `<div class="day ${cls}" id="g-${d}">
          <div class="date"><span class="dn">${parse(d).getDate()}</span><span class="dw">${esc(fmt(d, { weekday: "short" }).replace(".", ""))}</span><span class="mo">${esc(fmt(d, { month: "short" }).replace(".", ""))}</span>${d === oggi ? `<span class="oggi">Oggi</span>` : ""}</div>
          <div class="slots ${ls.length === 1 ? "one" : ""}">${ls.map(l => slot(l, mostraModulo)).join("")}</div>
        </div>`;
      }
      h += `</section>`;
    }
    return h;
  };
  // Archivio: le giornate già passate restano consultabili, ma chiuse sotto un pulsante
  const passati = conArchivio ? giorni.filter(([d]) => d < oggi) : [];
  const prossimi = giorni.filter(([d]) => !passati.length || d >= oggi);
  if (!passati.length || !prossimi.length) return settimane(giorni);
  const n = passati.reduce((s, [, ls]) => s + ls.length, 0);
  const apri = stato.archivio;
  return `<div class="arch"><button class="arch-btn" data-arch aria-expanded="${apri}">${ico("archive")}<span>Lezioni passate <span class="n">· ${n} ${n === 1 ? "incontro" : "incontri"}</span></span>${ico("down", "ico chev")}</button>
    ${apri ? `<div class="arch-body">${settimane(passati)}</div><div class="arch-end">Da oggi in poi</div>` : ""}</div>` + settimane(prossimi);
}

function renderCal() {
  const filtroAttivo = stato.q || stato.tipi.size;
  if (filtroAttivo) {
    const q = norm(stato.q);
    const ris = tutte.filter(l => (!q || testoRicerca(l).includes(q)) && (!stato.tipi.size || stato.tipi.has(l.tipo)));
    const cosa = [stato.q && `«${esc(stato.q)}»`, stato.tipi.size && [...stato.tipi].join(", ")].filter(Boolean).join(" · ");
    let h = `<div class="modhead"><span class="eyebrow">Risultati nei moduli pubblicati</span><h2>${ris.length} ${ris.length === 1 ? "incontro" : "incontri"}</h2><div class="meta"><span>${cosa}</span><button class="btn" data-reset>Mostra tutto</button></div></div>`;
    h += ris.length ? giorniHtml(ris, true) : `<div class="empty"><h2>Nessun risultato</h2><p>Prova con un cognome, il nome di un'azienda o una parola del titolo della lezione.</p></div>`;
    $("#view").innerHTML = h; return;
  }
  const m = D.moduli.find(x => x.id === stato.modulo);
  const idx = D.moduli.indexOf(m), prev = D.moduli[idx - 1], next = D.moduli[idx + 1];
  const nav = `<span class="modnav"><button data-mod="${esc(prev?.id || "")}" ${prev ? "" : "disabled"} aria-label="Modulo precedente">${ico("arrow-l")}</button><button data-mod="${esc(next?.id || "")}" ${next ? "" : "disabled"} aria-label="Modulo successivo">${ico("arrow-r")}</button></span>`;
  let h = `<div class="modhead"><span class="eyebrow">${esc(nomeModulo(m))}</span><h2>${esc(m.titolo)}</h2><div class="meta"><span>${esc(intervallo(m))}</span>${m.pubblicato ? `<span>${m.giorni.reduce((n, g) => n + g.lezioni.length, 0)} incontri</span>` : ""}${nav}</div></div>`;
  if (!m.pubblicato) {
    h += `<div class="locked"><h2>In arrivo</h2><p>Il calendario dettagliato di questo modulo, con docenti, ospiti e aziende, sarà pubblicato qui prima dell'inizio delle lezioni.</p></div>`;
  } else {
    h += giorniHtml(m.giorni.flatMap(g => g.lezioni.map(l => ({ ...l, mod: m }))), false, true);
  }
  $("#view").innerHTML = h;
}

/* ---------- sezione Eventi sotto la testata ---------- */
function renderEvid() {
  const ora = adesso(), oggi = isoDi(ora), visti = new Set();
  const ev = tutte.filter(l => l.evento && !visti.has(l.evento.id) && visti.add(l.evento.id))
    .filter(l => (l.evento.evidenza_dal || l.data) <= oggi && (l.data > oggi || (l.data === oggi && ora < quando(l.data, l.fine || "23:59"))))
    .sort((a, b) => (a.data + a.inizio).localeCompare(b.data + b.inizio));
  const box = $("#evid");
  if (!ev.length) { box.hidden = true; box.innerHTML = ""; return; }
  const giorno = d => d === oggi ? "Oggi" : giorniTra(ora, parse(d)) === 1 ? "Domani" : maiuscola(fmt(d, { weekday: "long", day: "numeric", month: "long" }));
  const [p, ...altri] = ev, e = p.evento;
  const luogo = (e.luogo || p.luogo || "").split(" · ").slice(0, 2).join(" · ");
  const info = [luogo, `${p.inizio}–${p.fine}`, (e.breve || "").split(" · ")[0]].filter(Boolean).map(esc).join(" · ");
  const nota = e.nota ? (i => i > 0 ? `<b>${esc(e.nota.slice(0, i))}</b>${esc(e.nota.slice(i))}` : esc(e.nota))(e.nota.indexOf(": ")) : "";
  box.innerHTML = `<div class="top"><div>
      <div class="ey">${ev.length > 1 ? "Eventi in programma" : "In evidenza"} · ${esc(giorno(p.data))}</div>
      <h3>${esc(p.titolo)}</h3>
      ${info ? `<p class="info">${info}</p>` : ""}${nota ? `<p class="rule">${nota}</p>` : ""}
    </div><button class="go" data-apri-ev="${esc(e.id)}">Programma ${ico("arrow-r")}</button></div>
    ${altri.length ? `<ul class="evid-more">${altri.map(l => `<li><button data-apri-ev="${esc(l.evento.id)}"><span class="d">${esc(riduci(fmt(l.data, { weekday: "short", day: "numeric", month: "short" })))}</span><span>${esc(l.titolo)}</span>${ico("arrow-r")}</button></li>`).join("")}</ul>` : ""}`;
  box.hidden = false;
}

/* ---------- eventi: apertura della card ---------- */

  const apri = forza ?? !stato.eventi.has(id);

  document.querySelectorAll(`[id="ev-${CSS.escape(id)}"]`).forEach(card => {
    const l = tutte.find(x => x.evento?.id === id); if (!l) return;
    card.outerHTML = slot(l, !!card.querySelector(".mod-of"));
  });
}
function apriEvento(id) {
  const l = tutte.find(x => x.evento?.id === id); if (!l) return;
  if (!$("#panel").hidden) chiudi();
  stato.eventi.add(id);
  scegliModulo(l.mod.id, l.data);

  const card = document.getElementById("ev-" + id);

document.addEventListener("click", e => {
  const t = e.target;
  const evb = t.closest("[data-ev]"); if (evb) { toggleEvento(evb.dataset.ev); return; }
  const eva = t.closest("[data-apri-ev]"); if (eva) { e.preventDefault(); if (eva.dataset.letto) { segnaLetti([eva.dataset.letto]); aggiornaContatori(); } apriEvento(eva.dataset.apriEv); return; }
  if (t.closest("[data-arch]")) { stato.archivio = !stato.archivio; renderCal(); return; }
  const vai = t.closest("[data-vai]");
  if (vai) { const [m, g] = vai.dataset.vai.split("|"); if (!$("#panel").hidden) chiudi(); scegliModulo(m, g); return; }
  const am = t.closest("[data-avv-mod]"); if (am) { e.preventDefault(); if (am.dataset.letto) segnaLetti([am.dataset.letto]); if (!$("#panel").hidden) chiudi(); aggiornaContatori(); scegliModulo(am.dataset.avvMod); return; }
  const mod = t.closest("[data-mod]"); if (mod && !mod.disabled) { scegliModulo(mod.dataset.mod); return; }
  const tipo = t.closest("[data-tipo]");
  if (tipo) { const x = tipo.dataset.tipo; stato.tipi.has(x) ? stato.tipi.delete(x) : stato.tipi.add(x); render(); return; }
  if (t.closest("[data-reset]")) { stato.q = ""; stato.tipi.clear(); $("#q").value = ""; stato.cerca = false; stato.filtra = false; render(); return; }
  const altri = t.closest("[data-altri]"); if (altri) { altri.outerHTML = decodeURIComponent(altri.dataset.altri); return; }
  const p = t.closest("[data-p]"); if (p) { apriPersona(p.dataset.p); return; }
  const o = t.closest("[data-o]"); if (o) { e.preventDefault(); apriOrg(o.dataset.o); return; }
  if (t.closest("[data-leggi]") || t.closest("#bell")) { apriAvvisi(); return; }
  if (t.closest("#path-btn")) { $("#path-list").hidden = !$("#path-list").hidden; renderPath(); return; }
  const nasc = t.closest("[data-chiudi-avviso]"); if (nasc) { segnaLetti([nasc.dataset.chiudiAvviso]); aggiornaContatori(); return; }
  if (t.closest("#fab")) { const x = obiettivoOggi(); if (x) scegliModulo(x.mod, x.data); return; }
  if (t.closest("#btn-search")) { stato.cerca = $("#search").hidden; if (!stato.cerca) { stato.q = ""; $("#q").value = ""; } render(); if (stato.cerca) $("#q").focus(); return; }
  if (t.closest("#btn-filter")) { stato.filtra = !stato.filtra; render(); return; }
  if (t.closest("#sub-btn")) { apriIscrizione(); return; }
  if (t.id === "copy-ics") {
    const inp = $("#ics-url");
    const ok = () => { t.textContent = "Copiato"; };
    if (navigator.clipboard) navigator.clipboard.writeText(inp.value).then(ok).catch(() => { inp.select(); });
    else inp.select();
    return;
  }
  if (t.id === "p-close" || t.id === "velo") chiudi();
});
document.addEventListener("keydown", e => { if (e.key === "Escape" && !$("#panel").hidden) chiudi(); });
$("#tab-cal").addEventListener("click", () => vaiSezione("cal"));
$("#tab-ppl").addEventListener("click", () => vaiSezione("ppl"));
$("#q").addEventListener("input", e => { stato.q = e.target.value.trim(); $("#q-clear").hidden = !stato.q; stato.tab === "cal" ? renderCal() : renderPeople(); });

addEventListener("scroll", () => requestAnimationFrame(aggiornaFab), { passive: true });
addEventListener("resize", () => requestAnimationFrame(aggiornaFab));

/* ---------- avvio ---------- */
const largo = () => matchMedia("(min-width: 761px)").matches;
stato.modulo = moduloIniziale();
if (largo()) $("#path-list").hidden = false;
if (location.hash === "#docenti") stato.tab = "ppl";
const ultimaModifica = (D.aggiornamenti || []).find(u => (u.tipo || "calendario") === "calendario");
$("#foot").innerHTML = `<span>${ultimaModifica ? `Ultima modifica al calendario: ${esc(fmt(ultimaModifica.quando.slice(0, 10), { weekday: "long", day: "numeric", month: "long" }))}, ${esc(ultimaModifica.quando.slice(11, 16))}` : `Aggiornato il ${esc(D.aggiornato)}`} · orari e ospiti possono cambiare: controlla prima di ogni lezione.</span><span>Master ${esc(D.master.titolo_master)} · Università IULM · ${esc(D.master.edizione)}</span>`;
renderHero();
renderEvid();
render();
aggiornaContatori();
if (location.hash === "#avvisi") apriAvvisi();
if (location.hash.startsWith("#evento-")) apriEvento(decodeURIComponent(location.hash.slice(8)));
setInterval(() => { renderNext(); renderEvid(); aggiornaContatori(); }, 60000);
/* Ritorno nell'app (telefono, schermata Home): orario e avvisi subito aggiornati.
   Se nel frattempo è stata pubblicata una versione più recente del calendario, la pagina si ricarica da sola,
   ma solo se lo studente non ha una scheda o la mappa aperta. Controllo al massimo ogni 5 minuti. */
let ultimoControllo = Date.now();
// confronto sul testo originale dei dati (come pubblicato), esclusa l'ora di generazione
const datiDi = html => { const m = html.match(/const D = (\{.*?\});\n/s); return m ? m[1].replace(/"aggiornato": "[^"]*"/, "") : null; };
const DATI_PAGINA = datiDi(document.documentElement.innerHTML);
function controllaVersione() {
  if (!/^https?:$/.test(location.protocol) || Date.now() - ultimoControllo < 5 * 60000) return;
  ultimoControllo = Date.now();
  fetch(location.pathname, { cache: "no-store" }).then(r => r.ok ? r.text() : "").then(html => {
    const nuovi = datiDi(html); if (!nuovi || !DATI_PAGINA) return;
    const libero = $("#panel").hidden && !document.querySelector(".zoomer");
    if (nuovi !== DATI_PAGINA && libero) location.reload();
  }).catch(() => {});
}
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState !== "visible") return;
  renderNext(); renderEvid(); aggiornaContatori(); controllaVersione();
});
setInterval(() => { if (document.visibilityState === "visible") controllaVersione(); }, 30 * 60000);
