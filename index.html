  // base degli edifici (punta della freccia) e punto di riferimento: l'IULM 1, edificio principale
  const BASE = { "IULM 1": [41.5, 65], "IULM 2": [62.5, 80], "IULM 3": [24.3, 69], "IULM 4": [47, 88], "IULM 5": [82.5, 69], "IULM 6": [63.6, 65], "IULM 7": [13, 60] };
  const RIF = "IULM 1", RIF_POS = [41.5, 69];
  const freccia = n => `<span class="arrow" style="left:${BASE[n][0]}%;top:${BASE[n][1]}%" aria-hidden="true"><svg viewBox="0 0 40 64"><path d="M14 2h12v34h12L20 62 2 36h12Z" fill="#D7263D" stroke="#fff" stroke-width="3" stroke-linejoin="round"/></svg></span>`;
  const SEGNO_RIF = `<svg viewBox="0 0 24 24" aria-hidden="true"><circle class="halo" cx="12" cy="12" r="12"/><circle cx="12" cy="12" r="7.5" fill="#1E9A4B" stroke="#fff" stroke-width="2.5"/><circle cx="12" cy="12" r="2.6" fill="#fff"/></svg>`;
  const conRif = (evid, solo) => solo && evid[0] !== RIF;
  const overlay = (evid, solo) => conRif(evid, solo) ? `<span class="refpin" style="left:${RIF_POS[0]}%;top:${RIF_POS[1]}%">${SEGNO_RIF}</span>` : "";
  const legenda = (n, rif) => `<ul class="legenda"><li><svg class="lg-a" viewBox="0 0 40 64" aria-hidden="true"><path d="M14 2h12v34h12L20 62 2 36h12Z" fill="#D7263D"/></svg><span><b>${n}</b>${rif ? "" : ", l’edificio indicato"}</span></li>${rif ? `<li><svg class="lg-r" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="#1E9A4B"/><circle cx="12" cy="12" r="3" fill="#fff"/></svg><span><b>${RIF}</b>, edificio principale: il punto di riferimento</span></li>` : ""}</ul>`;
  const mappa = (evid, solo) => {
    const rif = conRif(evid, solo);
    return `<button class="omap" data-zoom="${evid.join(",")}" aria-label="Ingrandisci la mappa del campus"><div class="ostage"><img src="campus_map.jpg" alt="Mappa ufficiale del campus IULM">${overlay(evid, solo)}${evid.map(freccia).join("")}</div>` +
      `<span class="zoom">⤢ Ingrandisci</span></button>` +
      (solo ? legenda(evid[0], rif) : `<ul class="legenda"><li><svg class="lg-a" viewBox="0 0 40 64" aria-hidden="true"><path d="M14 2h12v34h12L20 62 2 36h12Z" fill="#D7263D"/></svg><span>Edifici con lezioni del master · mappa ufficiale del campus IULM</span></li></ul>`);
  };
  const gmaps = n => "https://www.google.com/maps/dir/?api=1&travelmode=walking&destination=" + encodeURIComponent(ED[n] && ED[n].gm ? ED[n].gm : "Via Carlo Bo 1, 20143 Milano");

  // Scheda dell'edificio: la mappa indica, il testo conferma
  function scheda(n, aula, piano) {
    const e = ED[n] || {}, c = CAL[n];
    const elenco = aula ? [[aula, piano]] : c ? [...c.aule] : [];
    const lezioni = elenco.length ? elenco.map(([a, pz]) => `<b>${a}</b>${pz ? " · " + pz : ""}`).join("<br>") : `<span class="tenue">Al momento nessuna lezione del master in questo edificio.</span>`;
    apri(`<div class="ed-h"><span class="ey">Come arrivare</span><h2>${n}</h2></div>
      <div>${mappa([n], true)}</div>
      <dl class="facts">${e.tratto ? `<div><dt>Come riconoscerlo</dt><dd>${e.tratto}</dd></div>` : ""}<div><dt>Le tue lezioni qui</dt><dd>${lezioni}</dd></div></dl>
      <a class="gmb" href="${gmaps(n)}" target="_blank" rel="noopener">${ico("pin")}<span>Indicazioni con Google Maps<small>Percorso a piedi dalla tua posizione attuale</small></span><span class="gm-a" aria-hidden="true">↗</span></a>
      <div class="ed-foot"><span>${e.ind ? "Indirizzo" : "Campus"}: <b>${e.ind || "Via Carlo Bo 1"} · 20143 Milano</b></span><button class="lnk" data-campus>Tutti gli edifici ${ico("arrow-r")}</button></div>`);
    try { history.replaceState(null, "", "#come-arrivare-" + n.toLowerCase().replace(" ", "-")); } catch (err) {}
  }
  function apriDa(pl, n) {
    const aula = pl && pl.querySelector("b") ? pl.querySelector("b").textContent.trim() : "";
    const m = pl ? pl.textContent.match(/(\d+°\s*piano|piano terra)/i) : null;
    scheda(n, aula, m ? m[1].toLowerCase() : "");
  }
  function campus() {
    const tuttiEd = ["IULM 1", "IULM 2", "IULM 3", "IULM 4", "IULM 5", "IULM 6", "IULM 7"];
    const riga = n => {
      const c = CAL[n];
      const ds = c ? [...c.aule].map(([a, p]) => p ? `${a} · ${p}` : a).join(", ") : "Nessuna lezione in calendario";
      return `<button class="${c ? "mine" : ""}" data-ed-apri="${n}"><span class="n">${n.split(" ")[1]}</span><span><span class="nm">${n}${c ? `<span class="cnt">${c.incontri} ${c.incontri === 1 ? "incontro" : "incontri"}</span>` : ""}</span><span class="ds">${ds}</span></span>${ico("arrow-r")}</button>`;
    };
    apri(`<div class="ed-h"><span class="ey">Guida al campus</span><h2>Come raggiungere gli edifici</h2><p>Le frecce rosse indicano gli edifici delle lezioni del master. Tocca un edificio per aprire la sua scheda.</p></div>
      <div>${mappa(MASTER, false)}</div>
      <div class="arrivo-campus"><dl class="facts"><div><dt>In metro</dt><dd><span class="mm">M2</span><b>Romolo</b>, linea verde. In alternativa <b>Famagosta</b>, la fermata successiva.</dd></div><div><dt>Indirizzo</dt><dd>Via Carlo Bo 1 · 20143 Milano<br><span class="tenue">L’IULM 7 è in Via Filargo 38, di fronte alla metro Romolo.</span></dd></div></dl></div>
      <div class="edlist">${tuttiEd.map(riga).join("")}</div>`);
  }
  function zoom(list) {
    const nomi = list.split(",").filter(Boolean);
    const z = document.createElement("div");
    z.className = "zoomer"; z.setAttribute("role", "dialog"); z.setAttribute("aria-modal", "true"); z.setAttribute("aria-label", "Mappa del campus");
    z.innerHTML = `<div class="zbar"><span><b>Mappa del campus</b>${(nomi.length === 1 ? (nomi[0] === RIF ? "La freccia rossa indica l’IULM 1" : "In rosso l’" + nomi[0] + ", in verde l’IULM 1 come riferimento") : "Le frecce rosse indicano gli edifici delle lezioni").replace(/IULM /g, "IULM&nbsp;")}<br>Trascina per spostarti, usa + e − per lo zoom</span><button class="close-z">Chiudi</button></div>
      <div class="zview"><div class="zwrap"><img src="campus_map.jpg" alt="Mappa ufficiale del campus IULM">${overlay(nomi, nomi.length === 1)}${nomi.map(freccia).join("")}</div>
      <div class="zctl"><button class="zout" aria-label="Rimpicciolisci">−</button><button class="fit">Mappa intera</button><button class="zin" aria-label="Ingrandisci">+</button></div></div>`;
    document.body.appendChild(z);
    const view = z.querySelector(".zview"), wrap = z.querySelector(".zwrap"), img = z.querySelector("img");
    let W = 0, H = 0, s = 1, x = 0, y = 0, fit = 1;
    const vw = () => view.clientWidth, vh = () => view.clientHeight;
    const clamp = () => {
      const w = W * s, h = H * s;
      x = w <= vw() ? (vw() - w) / 2 : Math.min(0, Math.max(vw() - w, x));
      y = h <= vh() ? (vh() - h) / 2 : Math.min(0, Math.max(vh() - h, y));
    };
    const draw = () => { clamp(); wrap.style.transform = `translate(${x}px, ${y}px) scale(${s})`; };
    const zoomAt = (ns, px, py) => { ns = Math.min(fit * 6, Math.max(fit, ns)); x = px - (px - x) * (ns / s); y = py - (py - y) * (ns / s); s = ns; draw(); };
    const centro = () => [vw() / 2, vh() / 2];
    const init = () => {
      W = img.naturalWidth; H = img.naturalHeight; wrap.style.width = W + "px"; wrap.style.height = H + "px";
      fit = Math.min(vw() / W, vh() / H);
      const stretto = matchMedia("(max-width: 760px)").matches;
      s = stretto ? Math.max(fit, (vh() - 70) / H) : fit;      // telefono: mappa alta come lo schermo
      const cx = nomi.length ? nomi.reduce((a, n) => a + PIN[n][0], 0) / nomi.length / 100 * W : W / 2;
      const cy = nomi.length ? nomi.reduce((a, n) => a + PIN[n][1], 0) / nomi.length / 100 * H : H / 2;
      x = vw() / 2 - cx * s; y = vh() / 2 - cy * s; draw();
    };
    img.complete && img.naturalWidth ? init() : img.addEventListener("load", init);
    addEventListener("resize", draw);
    // trascinamento e pizzico
    const pt = new Map(); let last = null;
    const pos = ev => { const r = view.getBoundingClientRect(); return [ev.clientX - r.left, ev.clientY - r.top]; };
    view.addEventListener("pointerdown", ev => {
      if (ev.target.closest(".zctl")) return;
      view.setPointerCapture(ev.pointerId); pt.set(ev.pointerId, pos(ev)); view.classList.add("drag"); last = null;
    });
    view.addEventListener("pointermove", ev => {
      if (!pt.has(ev.pointerId)) return;
      const prev = pt.get(ev.pointerId), cur = pos(ev); pt.set(ev.pointerId, cur);
      if (pt.size === 1) { x += cur[0] - prev[0]; y += cur[1] - prev[1]; draw(); }
      else if (pt.size === 2) {
        const [a, b] = [...pt.values()], d = Math.hypot(a[0] - b[0], a[1] - b[1]), m = [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2];
        if (last) { x += m[0] - last.m[0]; y += m[1] - last.m[1]; zoomAt(s * d / last.d, m[0], m[1]); }
        last = { d, m };
      }
    });
    const fine = ev => { pt.delete(ev.pointerId); last = null; if (!pt.size) view.classList.remove("drag"); };
    view.addEventListener("pointerup", fine); view.addEventListener("pointercancel", fine);
    view.addEventListener("wheel", ev => { ev.preventDefault(); const [px, py] = pos(ev); zoomAt(s * Math.exp(-ev.deltaY * (ev.ctrlKey ? 0.01 : 0.0018)), px, py); }, { passive: false });
    view.addEventListener("dblclick", ev => { const [px, py] = pos(ev); s > fit * 1.05 ? (s = fit, draw()) : zoomAt(fit * 2.5, px, py); });
    z.querySelector(".zin").addEventListener("click", () => zoomAt(s * 1.5, ...centro()));
    z.querySelector(".zout").addEventListener("click", () => zoomAt(s / 1.5, ...centro()));
    z.querySelector(".fit").addEventListener("click", () => { s = fit; draw(); });
    z.querySelector(".close-z").focus();
    function k(ev) {
      if (ev.key === "Escape") { ev.stopImmediatePropagation(); via(); }
      else if (ev.key === "+" || ev.key === "=") zoomAt(s * 1.5, ...centro());
      else if (ev.key === "-") zoomAt(s / 1.5, ...centro());
      else if (ev.key.startsWith("Arrow")) { const d = 60; if (ev.key === "ArrowLeft") x += d; if (ev.key === "ArrowRight") x -= d; if (ev.key === "ArrowUp") y += d; if (ev.key === "ArrowDown") y -= d; draw(); }
    }
    const via = () => { z.remove(); document.removeEventListener("keydown", k, true); removeEventListener("resize", draw); };
    document.addEventListener("keydown", k, true);
    z.querySelector(".close-z").addEventListener("click", via);
  }
  // aule toccabili: segna i luoghi con l'edificio ogni volta che il calendario viene ridisegnato
  // nella card «Ora» l'aula resta testo: lì l'azione è il pulsante «Come arrivare»
  const segna = () => document.querySelectorAll(".place:not([data-ed])").forEach(p => {
    if (p.closest("#next")) return;
    const m = p.textContent.match(/IULM\s*(\d)/);
    if (m) { p.dataset.ed = "IULM " + m[1]; p.setAttribute("role", "button"); p.tabIndex = 0; p.title = "Come arrivare"; p.setAttribute("aria-label", "Come arrivare: " + p.textContent.trim()); }
  });
  const pulsanti = () => {
    const nx = document.querySelector("#next"), acts = nx && nx.querySelector(".next-actions"), pn = nx && nx.querySelector(".place"), mn = pn && pn.textContent.match(/IULM\s*(\d)/), p = mn && { dataset: { ed: "IULM " + mn[1] } };
    const go = document.querySelector("#evid .top > .go[data-apri-ev]");
    if (go) {
      const l = tutte.find(x => x.evento && x.evento.id === go.dataset.apriEv);
      const m = l && (l.luogo || "").match(/^(.*?)\s*\(\s*Edificio\s+IULM\s*(\d)\s*,?\s*([^)]*)\)/i);
      if (m) {
        const box = document.createElement("div"); box.className = "evid-acts";
        go.replaceWith(box);
        box.innerHTML = `<button class="go go-ed" data-ed-go="IULM ${m[2]}" data-aula="${esc(m[1].trim())}" data-piano="${esc(m[3].trim().toLowerCase())}">${ico("pin")}Come arrivare</button>`;
        box.appendChild(go);
      }
    }
    if (acts && p && !acts.querySelector(".go-ed")) { const v = acts.querySelector("[data-vai]"); (v || acts.firstElementChild).insertAdjacentHTML("afterend", `<button class="hbtn go-ed" data-ed-go="${p.dataset.ed}">${ico("pin")}Come arrivare</button>`); }
  };
  let lock = false;
  new MutationObserver(() => { if (lock) return; lock = true; segna(); pulsanti(); lock = false; }).observe(document.body, { childList: true, subtree: true });
  segna(); pulsanti();
  const h = location.hash.match(/^#come-arrivare-iulm-(\d)$/); if (h) setTimeout(() => scheda("IULM " + h[1]), 300);
  const hc = location.hash === "#campus"; if (hc) setTimeout(campus, 300);
  // strumenti (guida al campus + calendario sul telefono): un blocco della griglia della testata.
  // Telefono: Ora → percorso → strumenti affiancati. Computer: strumenti sotto la card «Ora», percorso a destra.
  const path = document.querySelector(".path");
  if (path) {
    const box = document.createElement("div"); box.className = "strumenti";
    path.after(box);
    box.innerHTML = `<section class="campus-desk only-desk" aria-label="Guida al campus">
      <div class="cd-top"><div><span class="eyebrow">Guida al campus</span><h3>Come arrivare</h3></div><button class="cd-map" data-campus>Tutti gli edifici ${ico("arrow-r")}</button></div>
      <label class="sr" for="cd-ed">Scegli l’edificio e apri le indicazioni</label>
      <div class="cd-sel">${ico("pin", "ico pin")}<select id="cd-ed"><option value="" selected disabled>Seleziona un edificio</option>${["IULM 1", "IULM 2", "IULM 3", "IULM 4", "IULM 5", "IULM 6", "IULM 7"].map(n => `<option value="${n}">${n}</option>`).join("")}</select>${ico("down", "ico chev")}</div>
    </section>
    <button class="campus-link only-phone" data-campus><span class="pinbox">${ico("pin")}</span><span><span class="t">Guida al campus</span><span class="s">Mappa ufficiale e indicazioni per raggiungere edifici e aule</span></span>${ico("arrow-r")}</button>
    <button class="campus-link tool" id="sub-btn" hidden><span class="pinbox">${ico("cal")}</span><span><span class="t">Calendario sul telefono</span><span class="s">Tutte le lezioni nel calendario del telefono, sempre aggiornate</span></span>${ico("arrow-r")}</button>`;
    const sel = box.querySelector("#cd-ed");
    sel.addEventListener("change", () => { const n = sel.value; if (!n) return; if (!$("#panel").hidden) { chiudi(); setTimeout(() => scheda(n), 300); } else scheda(n); sel.selectedIndex = 0; });
    verificaIcs();
  }
  // finché la novità della guida non è letta, le card della guida mostrano «Nuovo»
  const novitaGuida = () => { const n = avvisiAttivi().find(a => a.id === "novita-guida-campus"); return n && !letti().has(n.id); };
  const pillGuida = () => document.querySelectorAll(".campus-link[data-campus] .t, .campus-desk .eyebrow").forEach(t => {
    const p = t.querySelector(".pill-nuovo"); if (novitaGuida()) { if (!p) t.insertAdjacentHTML("beforeend", ` <span class="pill-nuovo">Nuovo</span>`); } else if (p) p.remove();
  });
  pillGuida(); setInterval(pillGuida, 2000);
  document.addEventListener("click", ev => {
    const z = ev.target.closest("[data-zoom]"); if (z && !z.closest(".zoomer")) { ev.preventDefault(); zoom(z.dataset.zoom); return; }
    const c = ev.target.closest("[data-campus]"); if (c) { ev.preventDefault(); ev.stopPropagation(); segnaLetti(["novita-guida-campus"]); aggiornaContatori(); pillGuida(); if (!$("#panel").hidden) { chiudi(); setTimeout(campus, 300); } else campus(); return; }
    const a = ev.target.closest("[data-ed-apri]"); if (a) { ev.preventDefault(); if (a.dataset.letto) { segnaLetti([a.dataset.letto]); aggiornaContatori(); } const n = a.dataset.edApri; if ($("#panel").hidden) { scheda(n); return; } chiudi(); setTimeout(() => scheda(n), 300); return; }
    if ((ev.target.id === "p-close" || ev.target.id === "velo") && location.hash.startsWith("#come-arrivare")) { try { history.replaceState(null, "", location.pathname + location.search); } catch (err) {} }
    const g = ev.target.closest("[data-ed-go]"); if (g) { ev.preventDefault(); ev.stopPropagation(); if (g.dataset.aula) { scheda(g.dataset.edGo, g.dataset.aula, g.dataset.piano); return; } const pl = (g.closest(".slot") || g.closest("#next") || document).querySelector(".place"); apriDa(pl, g.dataset.edGo); return; }
    const p = ev.target.closest(".place[data-ed]"); if (p) { ev.preventDefault(); ev.stopPropagation(); apriDa(p, p.dataset.ed); }
  }, true);
  document.addEventListener("keydown", ev => { const p = ev.target.closest && ev.target.closest(".place[data-ed]"); if (p && (ev.key === "Enter" || ev.key === " ")) { ev.preventDefault(); scheda(p.dataset.ed); } });
})();
</script>
